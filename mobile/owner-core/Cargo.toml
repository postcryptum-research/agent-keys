[package]
name = "owner-core"
version = "0.3.3"
edition = "2021"
description = "Kernel v3.3 encodings and ERC-4337 hashing shared by agent-signer and the mobile owner apps"
# Licence: not decided (docs/MOBILE_OWNER_PLAN.md, decision 3; README.md here).
# Deliberately no `license` field and not a member of the signer/ workspace.
publish = false

[lib]
# cdylib for the phone apps (uniffi); rlib for agent-signer.
crate-type = ["lib", "cdylib"]

# Arithmetic is checked (CLAUDE.md, house rule 10): `a + b` on integers and a
# narrowing or sign-changing `as` do not pass `cargo clippy`, which CI runs
# on every pull request.
[lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# clippy.toml names them: `Uint::to` and `Uint::wrapping_to`
disallowed_methods = "deny"

# The phone libraries are built from here in release: an overflow the lints
# cannot see stops the review instead of showing a wrapped number.
[profile.release]
overflow-checks = true

[features]
# The uniffi surface for the phone apps (src/ffi.rs); off for the CLI's build.
ffi = ["dep:uniffi", "dep:getrandom"]
# `cargo run --features cli --bin uniffi-bindgen` generates the bindings.
cli = ["ffi", "uniffi/cli"]
# Development builds only: facts for the CLI's local anvil chain (31337), where
# the test harness installs Base Sepolia's code at the same addresses
# (src/facts.rs). Never in a build that is distributed.
test-chains = []

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
uniffi = { version = "0.32", optional = true }
# The phone's half of a health digest (ffi.rs): the operating system's random
# source. Already in the tree through uniffi.
getrandom = { version = "0.4", optional = true }
alloy-primitives = { version = "1.7", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.7", default-features = false, features = ["std"] }
hw-signer = { path = "../../signer/crates/hw-signer", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Both in the versions that hw-signer's p256 brings (ECDSA, RFC 6979), so
# the phone library carries one copy of each.
sha2 = "0.11"
# The answer MAC (request.rs).
hmac = "0.13"
base64 = "0.22"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
getrandom = "0.4"

# A standalone package: the signer/ workspace depends on it by path, and its
# own tests run from this directory.
[workspace]
