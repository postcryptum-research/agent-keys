# `cargo audit` for owner-core (run from this directory). Accepted advisories,
# with the reasons; the same list as signer/.cargo/audit.toml where it overlaps.
[advisories]
ignore = [
    # RUSTSEC-2026-0387: timing variability in `crypto-bigint` 0.5.5. Nothing
    # in owner-core compiles it since issue #16 (`p256` 0.14 through hw-signer;
    # `cargo tree -i crypto-bigint@0.5.5` prints nothing). The lockfile still
    # lists it, as an optional dependency of `alloy-primitives` (its `k256`
    # feature, which owner-core does not enable), and `cargo audit` reads the
    # lockfile. Reviewed 2026-11-19; drop this line when `alloy-primitives` moves
    # to `k256` 0.14.
    "RUSTSEC-2026-0387",
]
# Also reported, not ignored here because it is a warning, not a vulnerability:
# RUSTSEC-2026-0374 (`basic-toml` unmaintained) and RUSTSEC-2024-0388
# (`derivative` unmaintained) reach the tree through `uniffi`'s bindings
# generator (`--features cli`), which runs on the developer's machine and is
# not part of the phone library.
