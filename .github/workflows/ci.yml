name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/foundry
      - name: forge test
        working-directory: contracts
        run: forge test --evm-version osaka

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/foundry      # anvil, for the CLI's local-chain tests
      - name: hw-signer
        working-directory: signer
        run: cargo test --locked -p hw-signer
      - name: agent-signer, with the local-chain tests
        working-directory: signer
        run: cargo test --locked -p agent-signer --features insecure-software-keys
      - name: owner-core
        working-directory: mobile/owner-core
        run: cargo test --locked --features ffi,test-chains

  # What a rule-enforcing bundler makes of the operations the CLI sends
  # (issue #83, scripts/erc7562/README.md). The bundler's package is installed
  # from the lock file with its install scripts off; of it, only the
  # validation tracer and the rule checker are used.
  erc7562:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/foundry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The checker, from the lock file
        working-directory: scripts/erc7562
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The recorded traces give the recorded verdicts
        working-directory: scripts/erc7562
        run: npm run check
      - name: Trace every operation of the local-chain tests
        working-directory: signer
        run: |
          node ../scripts/erc7562/write-tracer.mjs "$RUNNER_TEMP/tracer.js"
          ERC7562_TRACER="$RUNNER_TEMP/tracer.js" ERC7562_TRACE_DIR="$RUNNER_TEMP/traces" \
            cargo test --locked -p agent-signer --features insecure-software-keys --test anvil_cli
      - name: Verdicts
        working-directory: scripts/erc7562
        run: node check-run.mjs "$RUNNER_TEMP/traces" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc7562-traces
          path: ${{ runner.temp }}/traces
          retention-days: 7
