name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/foundry
      - name: forge test
        working-directory: contracts
        run: forge test --evm-version osaka
      # The CLI's local-chain tests (the review-to-install differential among
      # them) run this project's contracts from fixtures of bytecode. A
      # contract changed without them would leave those tests on the earlier
      # code, passing. scripts/test-fixtures.py --write brings them up.
      - name: the test fixtures are this build
        run: python3 scripts/test-fixtures.py

  # House rules 3 and 9: a pull request may change comments in contracts/src
  # freely; a contract whose bytecode differs from the merge base must carry
  # another VERSION (or, while it carries none, have its key changed in a
  # deployments file). scripts/source-record.sh says which contracts differ.
  source-record:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/foundry
      - name: Bytecode against the base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/source-record.sh "origin/$BASE_REF"

  rust:
    runs-on: ubuntu-latest
    env:
      CLIPPY_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # House rule 10: no unchecked arithmetic and no narrowing cast in the
      # code that ships. The lints are in the Cargo.toml files. Clippy is
      # pinned, so that a newer one seeing more sites does not turn a pull
      # request red with no change of code; raise the pin in its own change.
      # The Linux TPM backend builds here and is linted; the other hardware
      # backends are linted on the machines that build them.
      - name: the pinned clippy and the TPM library
        run: |
          rustup toolchain install "$CLIPPY_TOOLCHAIN" --profile minimal --component clippy
          sudo apt-get update -q && sudo apt-get install -y -q libtss2-dev
      - name: checked arithmetic, signer
        working-directory: signer
        run: |
          cargo "+$CLIPPY_TOOLCHAIN" clippy --locked -p hw-signer -p agent-signer
          cargo "+$CLIPPY_TOOLCHAIN" clippy --locked -p hw-signer -p agent-signer --features insecure-software-keys
          cargo "+$CLIPPY_TOOLCHAIN" clippy --locked -p hw-signer -p agent-signer --features tpm
      - name: checked arithmetic, owner-core
        working-directory: mobile/owner-core
        run: |
          cargo "+$CLIPPY_TOOLCHAIN" clippy --locked --features ffi
          cargo "+$CLIPPY_TOOLCHAIN" clippy --locked --features ffi,test-chains
      - name: hw-signer
        working-directory: signer
        run: cargo test --locked -p hw-signer
      - name: owner-core
        working-directory: mobile/owner-core
        run: cargo test --locked --features ffi,test-chains
      # The builds that ship: software keys refused in every role, no test
      # chain known. Two tests hold exactly that and exist only without the
      # test features.
      - name: owner-core, the regular build
        working-directory: mobile/owner-core
        run: cargo test --locked
      - name: agent-signer, the regular build
        working-directory: signer
        run: cargo test --locked -p agent-signer

  # A short run of every Rust fuzz target from its seeds (docs/FUZZING.md):
  # enough to see that the targets build and that no seed or near neighbour
  # breaks a rule. The long runs are made by hand.
  fuzz:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-06-21
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Each target for a minute
        working-directory: mobile/owner-core
        run: |
          # a list that failed or came short must not pass as "nothing crashed"
          targets=$(cargo +"$NIGHTLY" fuzz list)
          test "$(echo "$targets" | wc -w)" -eq 7
          for target in $targets; do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            cargo +"$NIGHTLY" fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time=60 -max_len=8192 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: mobile/owner-core/fuzz/artifacts
          retention-days: 14

  # The CLI's tests, the local-chain ones among them, and what a
  # rule-enforcing bundler makes of every operation they send (issue #83,
  # scripts/erc7562/README.md). The bundler's package is installed from the
  # lock file with its install scripts off; of it, only the validation tracer
  # and the rule checker are used.
  cli-and-erc7562:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/foundry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The checker, from the lock file
        working-directory: scripts/erc7562
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The recorded traces give the recorded verdicts
        working-directory: scripts/erc7562
        run: npm run check
      - name: agent-signer's tests, every operation of the local-chain ones traced
        working-directory: signer
        run: |
          node ../scripts/erc7562/write-tracer.mjs "$RUNNER_TEMP/tracer.js"
          ERC7562_TRACER="$RUNNER_TEMP/tracer.js" ERC7562_TRACE_DIR="$RUNNER_TEMP/traces" \
            cargo test --locked -p agent-signer --features insecure-software-keys
      - name: Verdicts
        working-directory: scripts/erc7562
        run: node check-run.mjs "$RUNNER_TEMP/traces" --gate --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc7562-traces
          path: ${{ runner.temp }}/traces
          retention-days: 7
