# `cargo audit` reads this file. Accepted advisories, each with the reason;
# review them whenever the dependency in question moves.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin timing side channel in `rsa`. It reaches the
    # lockfile through the `yubikey` crate (RSA PIV slots). The YubiKey
    # backend opens P-256 slots only and never signs or decrypts with RSA,
    # so the affected code never runs. Reviewed 2026-11-03; drop this line
    # when `yubikey` depends on a fixed `rsa`.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387: timing variability in `crypto-bigint` 0.5.5. Our own
    # crates are on `p256` 0.14 since issue #16 (`crypto-bigint` 0.7): the
    # signature checks, the test-only software backend and the encrypted key
    # file no longer run the affected code. What is left comes through
    # `alloy`, which still needs `k256` 0.13 and `elliptic-curve` 0.13 (2.6.1
    # of 2026-11-16 included): secp256k1 for transaction types and for the
    # gas wallet's key, a hot key that holds a few dollars. The hardware
    # backends do the private-key arithmetic on the device. Reviewed 2026-11-19
    # (issue #16); drop this line when `alloy` releases on `elliptic-curve`
    # 0.14 and the lockfile no longer holds `crypto-bigint` 0.5.
    "RUSTSEC-2026-0387",
]
