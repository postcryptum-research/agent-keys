[package]
name = "hw-signer"
version = "0.1.0"
description = "Hardware-backed P-256 signer abstraction (TPM 2.0, Secure Enclave, ...) for ERC-4337 agent accounts"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["software"]
# In-memory key. Dev/CI only: the one backend that exists on every platform.
# It makes keys, so it asks p256 for the operating system's random source;
# owner-core takes this crate without it.
software = ["p256/getrandom"]
# Hardware backends, one per platform. Each is feature-gated so the crate
# builds everywhere and a machine only compiles the backend it has.
#   tpm            Linux   — TPM 2.0 via tss-esapi (needs libtss2-dev)
tpm = ["dep:tss-esapi"]
#   secure-enclave macOS   — Apple Secure Enclave via CryptoKit (a Swift shim
#                            built by build.rs; needs the Xcode Command Line Tools)
secure-enclave = []
#   windows-tpm    Windows — TPM 2.0 via CNG's Platform Crypto Provider
windows-tpm = ["dep:windows"]
#   tropic01       any     — Tropic Square TROPIC01 USB DevKit (docs/TROPIC01.md)
tropic01 = ["dep:tropic01", "dep:serialport", "dep:embedded-hal", "dep:x25519-dalek", "dep:dummy-pin", "dep:rand_core"]
#   yubikey-piv    any     — YubiKey 5 PIV slot over PC/SC (docs/YUBIKEY.md);
#                            Linux needs pcscd and libpcsclite-dev
yubikey-piv = ["dep:yubikey", "dep:zeroize"]

[dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
# The TROPIC01 session's ephemeral X25519 key (x25519-dalek takes this line).
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = "0.11"
thiserror = "1"
# `generate-bindings`: run bindgen against the installed tpm2-tss headers
# instead of the crate's pre-generated bindings, which target an older tss
# ABI and segfault against tpm2-tss 4.x. Needs libtss2-dev + libclang.
tss-esapi = { version = "7", optional = true, features = ["generate-bindings"] }
# TROPIC01: the vendor's Rust SDK (embedded-hal driver), pinned to the
# revision whose USB-devkit example was verified against the chip.
tropic01 = { git = "https://github.com/tropicsquare/libtropic-rs", rev = "3310775775c211496d514f9110554884afa3ba80", default-features = false, features = ["keys", "x25519-dalek"], optional = true }
serialport = { version = "4.7", default-features = false, optional = true }
embedded-hal = { version = "1", optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"], optional = true }
dummy-pin = { version = "1", optional = true }
# YubiKey PIV: iqlusion's pure-Rust driver over PC/SC (BSD-2-Clause).
yubikey = { version = "0.9.0-rc.0", optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
hex = "0.4"
