[package]
name = "agent-signer"
version = "0.1.0"
description = "CLI for signing ERC-4337 agent operations with a hardware-held P-256 key"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agent-signer"
path = "src/main.rs"

[features]
default = []
# Enable `--backend tpm` (Linux, needs libtss2-dev).
tpm = ["hw-signer/tpm"]
# Enable Secure Enclave keys (macOS).
secure-enclave = ["hw-signer/secure-enclave"]
# Enable TPM keys through CNG (Windows).
windows-tpm = ["hw-signer/windows-tpm"]
# Enable TROPIC01 keys over the USB DevKit.
tropic01 = ["hw-signer/tropic01"]
# Enable YubiKey 5 PIV keys over PC/SC (docs/YUBIKEY.md).
yubikey = ["hw-signer/yubikey-piv"]
# Accept software (plaintext) keys from the config, in every role. Tests only:
# the integration tests (tests/anvil_cli.rs) drive owner and recovery
# operations on a local chain with them. A build without this feature refuses
# a software key in every role (docs/KEY_POLICY.md rule 5). The same test
# build gives owner-core its facts for that local chain (31337), so the phone
# review the CLI previews, and the simulated phone runs, knows the contracts
# the harness installs.
insecure-software-keys = ["owner-core/test-chains"]

[dependencies]
hw-signer = { path = "../hw-signer" }
# Shared with the mobile owner apps (docs/MOBILE_OWNER_DESIGN.md §7): Kernel
# encodings and the local userOpHash. Outside this workspace on purpose; see
# its README for the licence status.
owner-core = { path = "../../../mobile/owner-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
alloy = { version = "2", features = ["providers", "signer-local", "sol-types", "contract", "rpc-types", "network", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dotenvy = "0.15"
# Encrypted owner / recovery key files (docs/KEY_POLICY.md rule 5).
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
zeroize = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
# The phone owner's LAN session (docs/MOBILE_OWNER_DESIGN.md §3): a one-shot
# HTTP server and a QR in the terminal.
tiny_http = "0.12"
qrcode = "0.14"

# alloy's HTTP stack (reqwest → rustls → aws-lc-rs) builds AWS-LC from C and,
# on Windows x86_64, assembles it with NASM. The crate ships those objects
# prebuilt; using them makes NASM unnecessary on Windows.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aws-lc-sys = { version = "0.46", features = ["prebuilt-nasm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
