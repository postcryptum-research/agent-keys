<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>agent-keys — how it keeps an AI agent's funds safe</title>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="1200" height="180" fill="url(#hdr)"/>
  <text x="60" y="78" font-size="40" font-weight="800" fill="#ffffff">Your AI agent's money,</text>
  <text x="60" y="126" font-size="40" font-weight="800" fill="#a7f3d0">out of reach of a stolen file</text>
  <text x="60" y="160" font-size="18" fill="#e0e7ff">agent-keys · hardware-held keys + an on-chain mandate for autonomous agents</text>
  <g transform="translate(1010,40)">
    <rect width="130" height="100" rx="16" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="35" y="22" width="60" height="56" rx="8" fill="url(#chip)" stroke="#ecfdf5" stroke-width="3"/>
    <g stroke="#ecfdf5" stroke-width="3" stroke-linecap="round">
      <line x1="47" y1="14" x2="47" y2="22"/><line x1="65" y1="14" x2="65" y2="22"/><line x1="83" y1="14" x2="83" y2="22"/>
      <line x1="47" y1="78" x2="47" y2="86"/><line x1="65" y1="78" x2="65" y2="86"/><line x1="83" y1="78" x2="83" y2="86"/>
    </g>
    <path d="M57,52 l6,6 l12,-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Before -->
  <g filter="url(#shadow)">
    <rect x="40" y="215" width="545" height="345" rx="22" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  </g>
  <rect x="40" y="215" width="545" height="58" rx="22" fill="#e11d48"/>
  <rect x="40" y="250" width="545" height="23" fill="#e11d48"/>
  <text x="70" y="254" font-size="24" font-weight="800" fill="#ffffff">BEFORE · a key in a file</text>
  <!-- file icon -->
  <g transform="translate(70,300)">
    <path d="M0,0 h62 l22,22 v78 h-84 z" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
    <path d="M62,0 v22 h22" fill="none" stroke="#e11d48" stroke-width="3"/>
    <text x="10" y="58" font-size="13" font-weight="700" fill="#be123c">agent.key</text>
    <text x="10" y="78" font-size="11" fill="#9f1239">0x4f3a…</text>
  </g>
  <path d="M168,350 h52" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(232,318)">
    <circle cx="30" cy="30" r="30" fill="#fecdd3"/>
    <text x="30" y="42" font-size="34" text-anchor="middle">🕵️</text>
  </g>
  <text x="310" y="342" font-size="17" font-weight="700" fill="#9f1239">Whoever reads it</text>
  <text x="310" y="366" font-size="17" font-weight="700" fill="#9f1239">owns the wallet.</text>
  <g font-size="17" fill="#4c0519">
    <text x="70" y="440">✖  The agent's private key sits on disk</text>
    <text x="70" y="472">✖  Malware, a leaked backup or a poisoned</text>
    <text x="96" y="496">dependency can copy it in a second</text>
    <text x="70" y="528">✖  The key can sign anything, forever</text>
  </g>

  <!-- After -->
  <g filter="url(#shadow)">
    <rect x="615" y="215" width="545" height="345" rx="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  </g>
  <rect x="615" y="215" width="545" height="58" rx="22" fill="#059669"/>
  <rect x="615" y="250" width="545" height="23" fill="#059669"/>
  <text x="645" y="254" font-size="24" font-weight="800" fill="#ffffff">AFTER · a key inside a chip</text>
  <g transform="translate(650,298)">
    <rect x="8" y="8" width="84" height="84" rx="12" fill="url(#chip)"/>
    <g stroke="#059669" stroke-width="4" stroke-linecap="round">
      <line x1="28" y1="0" x2="28" y2="8"/><line x1="50" y1="0" x2="50" y2="8"/><line x1="72" y1="0" x2="72" y2="8"/>
      <line x1="28" y1="92" x2="28" y2="100"/><line x1="50" y1="92" x2="50" y2="100"/><line x1="72" y1="92" x2="72" y2="100"/>
      <line x1="0" y1="28" x2="8" y2="28"/><line x1="0" y1="50" x2="8" y2="50"/><line x1="0" y1="72" x2="8" y2="72"/>
      <line x1="92" y1="28" x2="100" y2="28"/><line x1="92" y1="50" x2="100" y2="50"/><line x1="92" y1="72" x2="100" y2="72"/>
    </g>
    <text x="50" y="62" font-size="30" text-anchor="middle">🔑</text>
  </g>
  <text x="772" y="330" font-size="17" font-weight="700" fill="#065f46">TPM · Apple Secure Enclave</text>
  <text x="772" y="354" font-size="17" font-weight="700" fill="#065f46">TROPIC01 · Windows TPM</text>
  <text x="772" y="382" font-size="15" fill="#047857">The chip signs. The key never leaves it.</text>
  <g font-size="17" fill="#022c22">
    <text x="645" y="440">✔  No key file exists — nothing to read or copy</text>
    <text x="645" y="472">✔  Every action is checked on-chain against</text>
    <text x="671" y="496">the owner's mandate</text>
    <text x="645" y="528">✔  The owner can revoke the agent in one step</text>
  </g>

  <!-- Flow -->
  <text x="40" y="618" font-size="26" font-weight="800" fill="#0f172a">How one action goes</text>
  <g font-size="16" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="40" y="640" width="200" height="150" rx="18" fill="#eef2ff"/>
      <rect x="275" y="640" width="200" height="150" rx="18" fill="#ecfdf5"/>
      <rect x="510" y="640" width="200" height="150" rx="18" fill="#e0f2fe"/>
      <rect x="745" y="640" width="200" height="150" rx="18" fill="#fef3c7"/>
      <rect x="980" y="640" width="180" height="150" rx="18" fill="#f0fdf4"/>
    </g>
    <text x="140" y="690" font-size="36">🤖</text>
    <text x="140" y="728" font-weight="800" fill="#3730a3">1 · The AI agent</text>
    <text x="140" y="752" fill="#4338ca">decides what to do</text>
    <text x="140" y="774" fill="#4338ca">(AgentKit, ElizaOS…)</text>

    <text x="375" y="690" font-size="36">🔐</text>
    <text x="375" y="728" font-weight="800" fill="#065f46">2 · The chip signs</text>
    <text x="375" y="752" fill="#047857">inside the hardware;</text>
    <text x="375" y="774" fill="#047857">no key in memory</text>

    <text x="610" y="690" font-size="36">🏦</text>
    <text x="610" y="728" font-weight="800" fill="#075985">3 · Smart account</text>
    <text x="610" y="752" fill="#0369a1">ERC-4337 Kernel</text>
    <text x="610" y="774" fill="#0369a1">checks the signature</text>

    <text x="845" y="690" font-size="36">📜</text>
    <text x="845" y="728" font-weight="800" fill="#92400e">4 · The mandate</text>
    <text x="845" y="752" fill="#b45309">AgentPolicy checks</text>
    <text x="845" y="774" fill="#b45309">every call on-chain</text>

    <text x="1070" y="690" font-size="30">✅ ⛔</text>
    <text x="1070" y="728" font-weight="800" fill="#166534">5 · Executed</text>
    <text x="1070" y="752" fill="#15803d">or refused —</text>
    <text x="1070" y="774" fill="#15803d">by the chain</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="242" y1="715" x2="270" y2="715"/>
    <line x1="477" y1="715" x2="505" y2="715"/>
    <line x1="712" y1="715" x2="740" y2="715"/>
    <line x1="947" y1="715" x2="975" y2="715"/>
  </g>

  <!-- Mandate -->
  <g filter="url(#shadow)">
    <rect x="40" y="830" width="545" height="330" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
  </g>
  <text x="70" y="878" font-size="24" font-weight="800" fill="#92400e">📜 The mandate</text>
  <text x="70" y="906" font-size="16" fill="#78350f">Set by the owner. Enforced by the chain, not by the agent.</text>
  <g font-size="16" font-weight="700">
    <rect x="70" y="930" width="235" height="44" rx="22" fill="#fef3c7"/><text x="187" y="958" text-anchor="middle" fill="#92400e">🎯 Allowed contracts</text>
    <rect x="320" y="930" width="235" height="44" rx="22" fill="#fef3c7"/><text x="437" y="958" text-anchor="middle" fill="#92400e">💸 Max per action</text>
    <rect x="70" y="988" width="235" height="44" rx="22" fill="#fef3c7"/><text x="187" y="1016" text-anchor="middle" fill="#92400e">💰 Total budget</text>
    <rect x="320" y="988" width="235" height="44" rx="22" fill="#fef3c7"/><text x="437" y="1016" text-anchor="middle" fill="#92400e">⏰ Time window</text>
    <rect x="70" y="1046" width="235" height="44" rx="22" fill="#fef3c7"/><text x="187" y="1074" text-anchor="middle" fill="#92400e">🪙 Token limits (USDC)</text>
    <rect x="320" y="1046" width="235" height="44" rx="22" fill="#fef3c7"/><text x="437" y="1074" text-anchor="middle" fill="#92400e">🧾 No blank checks</text>
  </g>
  <text x="70" y="1124" font-size="15" fill="#78350f">"No blank checks": no permits or off-chain signatures for the</text>
  <text x="70" y="1144" font-size="15" fill="#78350f">account — except x402 payments registered within the budget.</text>

  <!-- Worst case -->
  <g filter="url(#shadow)">
    <rect x="615" y="830" width="545" height="330" rx="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <text x="645" y="878" font-size="24" font-weight="800" fill="#3730a3">🛡️ If the worst happens</text>
  <g font-size="15">
    <text x="645" y="912" font-weight="800" fill="#475569">What happens</text>
    <text x="900" y="912" font-weight="800" fill="#be123c">Key file</text>
    <text x="1020" y="912" font-weight="800" fill="#047857">agent-keys</text>
    <line x1="645" y1="924" x2="1135" y2="924" stroke="#e2e8f0" stroke-width="2"/>

    <text x="645" y="956" fill="#0f172a">Malware reads the disk</text>
    <text x="900" y="956" fill="#be123c">all funds</text>
    <text x="1020" y="956" fill="#047857">nothing</text>

    <text x="645" y="998" fill="#0f172a">Prompt injection:</text>
    <text x="645" y="1018" fill="#0f172a">"send all to 0xdead"</text>
    <text x="900" y="1008" fill="#be123c">sent</text>
    <text x="1020" y="1008" fill="#047857">refused</text>

    <text x="645" y="1060" fill="#0f172a">Malware drives the agent</text>
    <text x="900" y="1060" fill="#be123c">all funds</text>
    <text x="1020" y="1050" fill="#047857">≤ the budget,</text>
    <text x="1020" y="1070" fill="#047857">then revoked</text>

    <text x="645" y="1112" fill="#0f172a">Laptop stolen</text>
    <text x="900" y="1112" fill="#be123c">key copied</text>
    <text x="1020" y="1102" fill="#047857">key stays in</text>
    <text x="1020" y="1122" fill="#047857">the chip</text>
  </g>

  <!-- Owner -->
  <g filter="url(#shadow)">
    <rect x="40" y="1195" width="1120" height="110" rx="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  </g>
  <text x="70" y="1240" font-size="34">👤</text>
  <text x="120" y="1236" font-size="22" font-weight="800" fill="#5b21b6">The owner stays in charge</text>
  <text x="120" y="1266" font-size="16" fill="#6d28d9">A separate owner key — in another chip, or an encrypted cold backup on a USB drive — sets the mandate,</text>
  <text x="120" y="1288" font-size="16" fill="#6d28d9">rotates the agent's key and revokes it in one transaction. The agent's machine never holds it.</text>

  <!-- Proof -->
  <text x="40" y="1352" font-size="22" font-weight="800" fill="#0f172a">Real hardware · real agent frameworks</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40" y="1370" width="150" height="38" rx="19" fill="#0d9488"/><text x="115" y="1395" fill="#ffffff">Linux TPM</text>
    <rect x="200" y="1370" width="160" height="38" rx="19" fill="#0d9488"/><text x="280" y="1395" fill="#ffffff">Windows TPM</text>
    <rect x="370" y="1370" width="210" height="38" rx="19" fill="#0d9488"/><text x="475" y="1395" fill="#ffffff">Apple Secure Enclave</text>
    <rect x="590" y="1370" width="130" height="38" rx="19" fill="#0d9488"/><text x="655" y="1395" fill="#ffffff">TROPIC01</text>

    <rect x="40" y="1420" width="190" height="38" rx="19" fill="#4338ca"/><text x="135" y="1445" fill="#ffffff">Coinbase AgentKit</text>
    <rect x="240" y="1420" width="110" height="38" rx="19" fill="#4338ca"/><text x="295" y="1445" fill="#ffffff">ElizaOS</text>
    <rect x="360" y="1420" width="80" height="38" rx="19" fill="#4338ca"/><text x="400" y="1445" fill="#ffffff">Jinn</text>
    <rect x="450" y="1420" width="80" height="38" rx="19" fill="#4338ca"/><text x="490" y="1445" fill="#ffffff">Olas</text>
    <rect x="540" y="1420" width="180" height="38" rx="19" fill="#4338ca"/><text x="630" y="1445" fill="#ffffff">Claude Code skill</text>
    <rect x="730" y="1420" width="150" height="38" rx="19" fill="#4338ca"/><text x="805" y="1445" fill="#ffffff">x402 payments</text>
  </g>
  <text x="1160" y="1385" font-size="13" text-anchor="end" fill="#64748b">Linux TPM, Secure Enclave and TROPIC01</text>
  <text x="1160" y="1403" font-size="13" text-anchor="end" fill="#64748b">keys signed live on Base Sepolia</text>
  <text x="1160" y="1445" font-size="14" text-anchor="end" fill="#64748b">github.com/postcryptum-research/agent-keys</text>
</svg>
