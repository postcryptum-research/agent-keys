[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 200
solc = "0.8.38"
# Pinned so bytecode and CREATE2 addresses are reproducible across machines and
# chains (with bytecode_hash = none the address depends on source + solc). >= 0.8.34
# avoids the 0.8.28-0.8.33 transient-storage codegen bug; see issue #123.
# A source file's `pragma solidity ^0.8.38;` (or the older `^0.8.24`) says what
# it admits; this line says what is used.
evm_version = "cancun"  # lowest common denominator with transient storage, for multi-chain; see #123
# No metadata in bytecode: solc's metadata hash embeds compiler settings
# (remappings included), so with it any config change would move every
# CREATE2 address. Without it, addresses depend on source and solc only.
bytecode_hash = "none"
cbor_metadata = false
# Dependency warnings (e.g. Solady's legacy `memory-safe-assembly` natspec on
# newer solc) are not ours to fix.
ignored_warnings_from = ["lib"]

# One transaction per test, which the tests assume: an operation and the
# reads that follow it share transient storage and warm slots. A newer forge
# defaults to a transaction per top-level call, and then the transient-storage
# tests and the gas benchmark fail. A setting of the test run; no bytecode
# depends on it.
isolate = false

# RIP-7212 P-256 precompile at 0x100 — live on Base / OP-Stack chains and
# enabled locally in forge/anvil by the `odyssey` flag. Without it the Solady
# verifier falls back to a deployed verifier contract (absent locally) and
# every P-256 check fails closed.
odyssey = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "kernel/=lib/kernel/",
    # eth-infinitism EntryPoint v0.7 sources (BasePaymaster); it expects
    # OpenZeppelin v5 under the npm-style path.
    "account-abstraction/=lib/account-abstraction/contracts/",
    "lib/account-abstraction/:@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    # Kernel v3.3 pins its own (older) solady and its tests import via `src/`.
    "lib/kernel/:solady/=lib/kernel/lib/solady/src/",
    "lib/kernel/:src/=lib/kernel/src/",
    "lib/kernel/:forge-std/=lib/forge-std/src/",
    "lib/kernel/:ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
    # Safe v1.4.1, for the Safe pass-through tests (Olas / Jinn service Safes).
    "safe-smart-account/=lib/safe-smart-account/contracts/",
]

# Tests read JSON vectors produced by `agent-signer vector ...`; the deploy
# script records addresses under deployments/; DeploymentsRecord.t.sol reads
# this file for the compiler settings it records (issue #123), and the
# deployments page, which must name every recorded address.
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "./foundry.toml" },
    { access = "read", path = "../docs/DEPLOYMENTS.md" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./benchmarks" },
]

[rpc_endpoints]
# Set in ../../.env (outside the repo); never hard-code an RPC URL here.
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
